<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Studio Summer Program – Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">

  <header class="masthead">
    <h1>Open Studio Summer Program</h1>
    <p>Applications for the 2027 cohort are open. Complete the form and you’ll get a printable confirmation right away.</p>
  </header>

  <!-- ===== Form ===== -->
  <section id="formView" aria-label="Application form">
    <form id="regForm" class="card" novalidate>

      <fieldset>
        <legend>About you</legend>
        <div class="grid">
          <div class="field span2">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" required>
            <small class="err" data-for="fullName"></small>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <small class="err" data-for="email"></small>
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" required>
            <small class="err" data-for="phone"></small>
          </div>
          <div class="field">
            <label for="dob">Date of birth</label>
            <input id="dob" name="dob" type="date" autocomplete="bday" required>
            <small class="hint">You must be 16 or older.</small>
            <small class="err" data-for="dob"></small>
          </div>
          <div class="field">
            <label for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required>
            <small class="err" data-for="city"></small>
          </div>
          <div class="field span2" role="group" aria-labelledby="genderLabel">
            <span class="label" id="genderLabel">Gender</span>
            <div class="choices">
              <label><input type="radio" name="gender" value="Female"> Female</label>
              <label><input type="radio" name="gender" value="Male"> Male</label>
              <label><input type="radio" name="gender" value="Non-binary"> Non-binary</label>
              <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
            </div>
            <small class="err" data-for="gender"></small>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Your application</legend>
        <div class="grid">
          <div class="field">
            <label for="education">Highest education</label>
            <select id="education" name="education" required>
              <option value="">Choose one</option>
              <option>High school</option>
              <option>Diploma</option>
              <option>Bachelor’s degree</option>
              <option>Master’s degree</option>
              <option>Other</option>
            </select>
            <small class="err" data-for="education"></small>
          </div>
          <div class="field">
            <label for="track">Program track</label>
            <select id="track" name="track" required>
              <option value="">Choose one</option>
              <option>Web Development</option>
              <option>Data Analysis</option>
              <option>UI/UX Design</option>
              <option>Digital Marketing</option>
            </select>
            <small class="err" data-for="track"></small>
          </div>
          <div class="field span2" role="group" aria-labelledby="intLabel">
            <span class="label" id="intLabel">I’m also interested in <span class="hint">(optional)</span></span>
            <div class="choices">
              <label><input type="checkbox" name="interests[]" value="Mentorship"> Mentorship</label>
              <label><input type="checkbox" name="interests[]" value="Hackathons"> Hackathons</label>
              <label><input type="checkbox" name="interests[]" value="Internship placement"> Internship placement</label>
              <label><input type="checkbox" name="interests[]" value="Scholarship"> Scholarship</label>
            </div>
          </div>
          <div class="field span2">
            <label for="statement">Why do you want to join?</label>
            <textarea id="statement" name="statement" rows="5" maxlength="500" required></textarea>
            <small class="hint"><span id="count">0</span> / 500 characters (minimum 20)</small>
            <small class="err" data-for="statement"></small>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label class="check"><input type="checkbox" id="terms" name="terms"> I confirm the details above are correct and agree to the program terms.</label>
        <small class="err" data-for="terms"></small>
      </div>

      <button type="submit" class="btn">Submit application</button>
    </form>
  </section>

  <!-- ===== Confirmation (filled by JavaScript) ===== -->
  <section id="receiptView" aria-label="Application confirmation" hidden>
    <div id="receipt" aria-live="polite"></div>
    <div class="actions">
      <button type="button" class="btn" id="printBtn">Print confirmation</button>
      <button type="button" class="btn ghost" id="newBtn">Start a new application</button>
    </div>
  </section>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
